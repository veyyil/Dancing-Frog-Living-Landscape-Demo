<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dancing Frog Living Landscape</title>
<meta name="description" content="A concept preview of a living landscape experience for Dancing Frog Habitat collective members.">
<meta property="og:title" content="Dancing Frog Living Landscape">
<meta property="og:description" content="A concept preview of a living landscape experience for Dancing Frog Habitat collective members.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://veyyil.github.io/dancing-frog-demo/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#233021">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens ===== */
:root{
  --paper:#EDEADA; --paper-2:#E3DFCA; --card:#F5F2E6;
  --ink:#233021; --ink-2:#4A5744; --ink-3:#7C8574;
  --moss:#4E6B3A; --moss-2:#7F9A62; --wash:#A7BB88; --wash-2:#CCD6B1;
  --stream:#4F8690; --stream-2:#A3C4C5;
  --ochre:#A97C2F; --ochre-2:#E6D2A0; --bark:#7A5A3C;
  --line:rgba(35,48,33,.14); --line-2:rgba(35,48,33,.28);
  --on-moss:#F5F2E6;
  --serif:"Newsreader","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161B15; --paper-2:#1E251C; --card:#212A1F;
    --ink:#E6E5D4; --ink-2:#BFC4AF; --ink-3:#8E957F;
    --moss:#9CBB7B; --moss-2:#7E9C61; --wash:#4D6A3B; --wash-2:#34472B;
    --stream:#86BAC1; --stream-2:#3C676D;
    --ochre:#D9AC5E; --ochre-2:#5E4A24; --bark:#C79E71;
    --line:rgba(230,229,212,.12); --line-2:rgba(230,229,212,.26);
    --on-moss:#161B15;
  }
}
:root[data-theme="dark"]{
  --paper:#161B15; --paper-2:#1E251C; --card:#212A1F;
  --ink:#E6E5D4; --ink-2:#BFC4AF; --ink-3:#8E957F;
  --moss:#9CBB7B; --moss-2:#7E9C61; --wash:#4D6A3B; --wash-2:#34472B;
  --stream:#86BAC1; --stream-2:#3C676D;
  --ochre:#D9AC5E; --ochre-2:#5E4A24; --bark:#C79E71;
  --line:rgba(230,229,212,.12); --line-2:rgba(230,229,212,.26);
  --on-moss:#161B15;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.wrap{padding:0 16px}}

/* ===== Demo bar (presenter chrome, not product) ===== */
.demobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper-2);border-bottom:1px solid var(--line);font-family:var(--sans);font-size:13px;color:var(--ink-2)}
.demobar .wrap{display:flex;gap:14px;align-items:center;justify-content:space-between;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}
.demobar .tag{display:flex;gap:10px;align-items:center}
.pill-note{border:1px solid var(--ochre);color:var(--ochre);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--card);gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 13px;border-radius:999px;cursor:pointer;font-family:var(--sans);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.linkbtn{background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2);font-family:var(--sans);font-size:13px}

/* ===== Member header ===== */
.mhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding:40px 0 26px;border-bottom:1px solid var(--line)}
.mhead h1{font-size:clamp(36px,5.4vw,60px);line-height:1;font-weight:500;letter-spacing:-.015em;margin:0}
.mhead .sub{font-style:italic;font-size:clamp(20px,2.4vw,25px);color:var(--moss);margin:8px 0 10px;font-weight:400}
.mhead .lede{max-width:50ch;color:var(--ink-2);margin:0}
.signed{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-top:14px}
.timebox{font-family:var(--sans)}
.timebox .lbl{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.timeseg{display:flex;border:1px solid var(--line-2);border-radius:16px;background:var(--card);padding:4px;gap:4px}
.timeseg button{border:0;background:transparent;border-radius:12px;padding:10px 18px;cursor:pointer;text-align:left;min-width:132px}
.timeseg b{display:block;font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.15}
.timeseg span{display:block;font-size:12px;color:var(--ink-3)}
.timeseg button[aria-pressed="true"]{background:var(--moss);color:var(--on-moss)}
.timeseg button[aria-pressed="true"] span{color:var(--on-moss);opacity:.85}
@media (max-width:760px){.mhead{grid-template-columns:1fr}.timeseg button{flex:1;min-width:0}}

/* ===== Member grid ===== */
.mgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:34px;padding:30px 0 10px}
@media (max-width:940px){.mgrid{grid-template-columns:1fr}}
.maparea{position:relative}
@media (min-width:941px){.maparea{position:sticky;top:72px;align-self:start}}
@media (max-width:640px){.mapcap{position:static;padding:12px 14px 0}.zlabel{font-size:30px;stroke-width:7px}.zlabel.muted{font-size:26px}.zlabel.small{font-size:22px}}
.morebtn{margin-top:10px;border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-family:var(--sans);font-size:13.5px;color:var(--ink)}
.mapcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.mapcard svg{display:block;width:100%;height:auto}
.mapcap{position:absolute;left:18px;top:14px;font-style:italic;color:var(--ink-2);font-size:15px;pointer-events:none}
.mapcap small{display:block;font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--ink-3)}
.maphint{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin:10px 2px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 2px 0;font-family:var(--sans);font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{flex:none}

/* map classes */
.b-fill{fill:var(--paper-2)}
.mapsvg{position:relative}
.viewas{color:var(--ink-3);font-size:12.5px}
.sm{display:none}
.sathead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.sathead h2{margin:0}
.satgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:980px}
.satcap{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-top:4px}
.section .ramp{margin-top:12px}
.nudge{animation:nudge 1.8s ease-out infinite}
@keyframes nudge{0%{box-shadow:0 0 0 0 rgba(185,138,59,.7)}70%{box-shadow:0 0 0 10px rgba(185,138,59,0)}100%{box-shadow:0 0 0 0 rgba(185,138,59,0)}}
.zhit.nudge-zone{fill:#b98a3b;fill-opacity:.12;stroke:#b98a3b;stroke-width:3;animation:nzone 1.8s ease-in-out infinite}
@keyframes nzone{50%{fill-opacity:.3}}
@media (prefers-reduced-motion:reduce){.nudge{animation:none;box-shadow:0 0 0 3px rgba(185,138,59,.7)}.zhit.nudge-zone{animation:none}}
@media (max-width:640px){
  body{font-size:16px}
  .demobar .wrap{gap:8px;padding-top:8px;padding-bottom:8px}
  .demobar .brand{display:none}
  .demobar .viewtag{width:100%;justify-content:space-between;gap:8px}
  .demobar .seg button{padding:8px 12px;font-size:13px;white-space:nowrap}
  .lg{display:none}.sm{display:inline}
  .viewas,.linkbtn{white-space:nowrap}
  .preview{padding:10px 12px}
  .preview .fi{grid-template-columns:64px minmax(0,1fr);gap:10px}
  .mhead{padding:26px 0 18px;gap:18px}
  .mhead .sub{font-size:20px}
  .signed{margin-top:8px}
  .timeseg button{padding:10px 12px}
  .timeseg b{font-size:19px}
  .mgrid{padding-top:20px;gap:26px}
  .mapcard{display:flex;flex-direction:column}
  .mapcard .mapsvg{order:3}
  .mapcap{order:1;padding:12px 14px 4px}
  .basesw{position:static;order:2;align-self:flex-start;margin:4px 12px 8px}
  .pop{width:220px;padding:10px}
  .chip{padding:8px 12px;font-size:13px}
  .legend{gap:6px 14px;font-size:12px}
  .fi{grid-template-columns:84px minmax(0,1fr);gap:12px}
  .fi-title{font-size:18px}
  .fi-text{font-size:15.5px}
  .satgrid{grid-template-columns:1fr}
  .section{padding:28px 0;margin-top:16px}
  .drawer{padding-left:18px;padding-right:18px}
  .drawer h2{font-size:28px}
  .chead{padding:24px 0 14px}
  .process{font-size:13px;gap:8px 14px}
  .detail{padding:16px}
  .actions .btn{flex:1 1 auto;min-height:44px}
  .crow .btn{min-height:40px}
  .toast{flex-wrap:wrap;justify-content:center;text-align:center}
}

.disc{color:var(--ink-3);font-size:12px}
@media (max-width:640px){.disc{display:none}}
.layers{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 2px 0;font-family:var(--sans);font-size:12.5px;color:var(--ink-3)}
.layers span{margin-right:4px}
.fi-title{font-size:20px;font-weight:500;line-height:1.2;margin:6px 0 2px}
.process{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:18px 0 0;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-family:var(--sans);font-size:13.5px;color:var(--ink-2)}
.process b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--paper-2);color:var(--ink);font-size:11.5px;margin-right:7px;font-weight:600}
.process strong{margin-left:auto;color:var(--moss);font-weight:600}
@media (max-width:640px){.process strong{margin-left:0}}
.checks{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.crow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;font-family:var(--sans);font-size:13.5px}
.clbl{color:var(--ink-3)}
.cval.ok{color:var(--moss);font-weight:500}.cval.pend{color:var(--ochre);font-weight:500}.cval.todo{color:var(--ink-2)}
.cnote{margin:2px 0 0;font-family:var(--sans);font-size:12.5px;color:var(--ink-3)}
@media (max-width:640px){.crow{grid-template-columns:1fr auto}.clbl{grid-column:1/-1}}
.preview{margin-top:18px;border:1px dashed var(--moss-2);border-radius:14px;padding:12px 16px;background:color-mix(in srgb,var(--wash-2) 25%,transparent)}
.preview .lbl{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.preview .fi{border-top:0;padding:8px 0 4px}
.zlink[disabled]{cursor:default;text-decoration:none;color:var(--ink-2)}
.basesw{position:absolute;right:14px;top:12px;z-index:3}
.mapcard.sat .mapcap{color:#e3e8d2}
.on-sat{background:#2c3a28}
.on-sat .z-doc{fill:#cfe0a8;opacity:.42}
.on-sat .z-doc-edge{stroke:#eef4d6;opacity:.9}
.on-sat .z-part{fill:#e6ecc8;opacity:.22}
.on-sat .hatch-line{stroke:#f2f5e4;opacity:.75}
.on-sat .z-none{stroke:#f2f5e4;opacity:.85}
.on-sat .contour{display:none}
.on-sat .stream-under{opacity:.25}
.on-sat .stream{stroke:#8fd3e0}
.on-sat .trail{stroke:#f0c98a}
.on-sat .boundary{stroke:#F5F2E6}
.on-sat .zlabel{fill:#F5F2E6;stroke:rgba(20,28,18,.75)}
.on-sat .zlabel.muted{fill:#e3e8d2}
.on-sat .compass,.on-sat .compass-t{stroke:#e3e8d2;fill:none}
.on-sat .compass-t{fill:#e3e8d2;stroke:none}
.stip-dot{fill:var(--ink-3);opacity:.42}
.stip-tick{stroke:var(--ink-3);stroke-width:1;opacity:.35;fill:none}
.contour{fill:none;stroke:var(--ink-3);stroke-width:1;opacity:.22}
.z-doc{fill:var(--wash);opacity:.85;filter:url(#wc)}
.z-doc-edge{fill:none;stroke:var(--moss-2);stroke-width:2.2;opacity:.55;filter:url(#wc)}
.z-part{fill:var(--wash-2);opacity:.8;filter:url(#wc)}
.z-part-h{fill:url(#hatch);filter:url(#wc)}
.hatch-line{stroke:var(--moss-2);stroke-width:1.4;opacity:.7}
.z-none{fill:none;stroke:var(--ink-3);stroke-width:1.3;stroke-dasharray:2 7;stroke-linecap:round;opacity:.7}
.stream-under{fill:none;stroke:var(--stream-2);stroke-width:10;stroke-linecap:round;opacity:.6;filter:url(#wc)}
.stream{fill:none;stroke:var(--stream);stroke-width:2.6;stroke-linecap:round}
.stream.approx{stroke-dasharray:1 7;stroke-width:2.4;opacity:.75}
.trail{fill:none;stroke:var(--bark);stroke-width:2.1;stroke-dasharray:7 5;stroke-linecap:round}
.boundary{fill:none;stroke:var(--ink);stroke-width:2.2;opacity:.8}
.boundary2{fill:none;stroke:var(--ink);stroke-width:1;opacity:.35;filter:url(#wc)}
.zlabel{font-family:var(--serif);font-size:18px;fill:var(--ink);paint-order:stroke;stroke:var(--paper-2);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.zlabel.muted{font-style:italic;fill:var(--ink-3);font-size:16px}
.zlabel.small{font-size:13px;font-family:var(--sans);fill:var(--ink-3)}
.zhit{fill:transparent;cursor:pointer;outline:none}
.zhit:hover,.zhit:focus-visible{fill:var(--ink);fill-opacity:.07}
.zhit:focus-visible{stroke:var(--ochre);stroke-width:2}
.mk{cursor:pointer;outline:none}
.mk-obs{fill:var(--card);stroke:var(--ink);stroke-width:2}
.mk-obs-in{fill:var(--ink)}
.mk-prop{fill:var(--card);stroke:var(--bark);stroke-width:2}
.mk-ct{fill:var(--bark)}
.mk-ct-in{fill:var(--card)}
.mk-gen{fill:var(--stream);fill-opacity:.12;stroke:var(--stream);stroke-width:1.5;stroke-dasharray:4 4}
.mk:hover .mk-obs,.mk:focus-visible .mk-obs,.mk:hover .mk-prop,.mk:focus-visible .mk-prop{stroke:var(--ochre)}
.mk:focus-visible .mk-ct,.mk:hover .mk-ct{fill:var(--ochre)}
.mk-new{fill:none;stroke:var(--ochre);stroke-width:2}
.compass{fill:none;stroke:var(--ink-3);stroke-width:1.2}
.compass-t{font-family:var(--serif);font-style:italic;font-size:15px;fill:var(--ink-3)}
.appear{animation:appear 1.1s ease both}
@keyframes appear{from{opacity:0}}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion:reduce){.appear,.pulse{animation:none}}

/* popover */
.pop{position:absolute;z-index:5;width:260px;background:var(--card);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 10px 30px rgba(20,28,18,.18);padding:12px;transform:translate(-50%,calc(-100% - 16px))}
.pop.below{transform:translate(-50%,16px)}
.pop .media{border-radius:9px;aspect-ratio:16/10}
.pop p{margin:8px 0 6px;font-size:15px;line-height:1.4}
.pop .row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-family:var(--sans);font-size:12px;color:var(--ink-3)}
.pop .x{position:absolute;right:8px;top:6px;border:0;background:var(--card);border-radius:50%;width:26px;height:26px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1}

/* ===== Side column ===== */
.side h2,.section h2{font-weight:500;font-size:26px;line-height:1.15;margin:0 0 6px;letter-spacing:-.005em}
.side .note{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.progress{padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--paper-2);border:1px solid var(--line);margin:14px 0 10px}
.bar i{display:block;height:100%;transition:width .9s ease}
.bar .b1{background:var(--moss-2)}
.bar .b2{background:repeating-linear-gradient(135deg,var(--wash-2) 0 4px,var(--wash) 4px 7px)}
.progress p{margin:0;color:var(--ink-2)}
.progress p strong{color:var(--ink);font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:18px 0 0;font-family:var(--sans)}
.facts div{border-top:1px solid var(--line);padding-top:8px}
.facts dt{font-size:12.5px;color:var(--ink-3)}
.facts dd{margin:2px 0 0;font-family:var(--serif);font-size:24px;font-weight:500}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* feed */
.feed{list-style:none;margin:0;padding:0}
.fi{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.fi:first-child{border-top:0;padding-top:4px}
.fi .media{aspect-ratio:1/1;border-radius:10px}
.fi.no-media{grid-template-columns:minmax(0,1fr)}
.fi-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-family:var(--sans);font-size:12.5px;color:var(--ink-3)}
.kind{color:var(--ink);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k,var(--ink-3))}
.k-camera{--k:var(--bark)}.k-field{--k:var(--moss)}.k-explore{--k:var(--moss-2)}.k-research{--k:var(--stream)}.k-property{--k:var(--ochre)}.k-landscape{--k:var(--wash)}
.fi-text{margin:5px 0 8px;font-size:16.5px;line-height:1.45}
.fi-foot{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-family:var(--sans);font-size:12.5px;color:var(--ink-3)}
.zlink{border:0;background:none;padding:0;cursor:pointer;color:var(--moss);text-decoration:underline;text-underline-offset:3px;font-family:var(--sans);font-size:12.5px}
.ver{display:inline-flex;align-items:center;gap:5px}
.ver.ok{color:var(--moss)}
.ver.pend{color:var(--ochre)}
.ver.gen{color:var(--stream)}
.newtag{background:var(--ochre);color:var(--paper);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:500}
.fi.is-new{background:linear-gradient(90deg,color-mix(in srgb,var(--ochre-2) 45%,transparent),transparent 70%);border-radius:12px;padding-left:10px;padding-right:6px}
.empty{font-style:italic;color:var(--ink-3);padding:10px 0}

/* media and placeholders */
.media{position:relative;margin:0;overflow:hidden;background:var(--paper-2)}
.media img{width:100%;height:100%;object-fit:cover}
.ph{display:flex;flex-direction:column;justify-content:flex-end;padding:8px;background:
  radial-gradient(120% 90% at 20% 10%,color-mix(in srgb,var(--wash) 70%,transparent),transparent 60%),
  radial-gradient(90% 80% at 85% 90%,color-mix(in srgb,var(--moss-2) 55%,transparent),transparent 65%),
  var(--wash-2);
  border:1px dashed var(--line-2)}
.ph.is-ct{background:radial-gradient(80% 70% at 50% 40%,#8a8f86,#3b3f3a 75%);border-color:#555}
.ph-id{font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--card) 80%,transparent);align-self:flex-start;border-radius:5px;padding:1px 5px;word-break:break-all}

.foot{padding:26px 0 48px;border-top:1px solid var(--line);font-family:var(--sans);font-size:12.5px;color:var(--ink-3);max-width:80ch}

function streamDist(x,y){let m=1e9;for(const p of STREAM_SAMPLES){const d=(p[0]-x)**2+(p[1]-y)**2;if(d<m)m=d}return Math.sqrt(m)}

  let n=.5+.17*Math.sin(x*.013+1.3)*Math.cos(y*.017-.4)+.11*Math.sin((x+y)*.031)+.08*Math.cos(x*.047-y*.021);
  const d=streamDist(x,y);n+=.24*Math.exp(-(d*d)/(2*55*55));

}

function zoneDrawer(){
  if(!state.zone)return"";
  const z=ZMAP[state.zone],info=ZONE_INFO[z.id]||{},m=state.month,st=zoneStatus(z);
  const items=visibleFeed().filter(f=>f.zone===z.id);
  const obs=items.filter(f=>["field","explore","property"].includes(f.kind));
  const cams=items.filter(f=>f.kind==="camera");
  const trails=TRAILS.filter(t=>t.m<=m&&t.zones.includes(z.id));
  const streams=STREAMS.filter(s=>s.zone===z.id&&s.m<=m);
  const cts=CTS.filter(c=>c.zone===z.id&&c.m<=m);
  const research=(info.research||[]).filter(r=>r.m<=m);
  const hist=(info.hist||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
  const shown=hist.filter(h=>h.m<=m),later=m===1?hist.filter(h=>h.m>m).length:0;
  const pubHist=state.published.filter(p=>p.zone===z.id).map(p=>({d:null,t:p.text}));
  const photos=[...new Set(items.map(i=>i.img).filter(Boolean))];
  const li=(t,s)=>`<li>${esc(t)}${s?`<small>${esc(s)}</small>`:""}</li>`;
  const sec=(title,body,empty)=>`<h3>${title}</h3>${body||`<p class="empty">${empty}</p>`}`;
  const season=info.season?info.season[m]:(m===1?"Seasonal context will build here once a full season of imagery is available.":"This area follows the wider post monsoon greening seen across the property.");
  return `<div class="backdrop" data-action="closezone"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dz">
    <button class="close" data-action="closezone">Close</button>

    ${sec("Trails",trails.length?`<ul class="dl">${trails.map(t=>li(t.name,`${t.km} km mapped`)).join("")}</ul>`:"","No trails mapped here yet.")}
    ${sec("Streams",streams.length?`<ul class="dl">${streams.map(s=>li(s.name,"Walked and mapped")).join("")}</ul>`:"","No stream sections mapped here yet.")}
    ${sec("Field observations",obs.length?`<ul class="dl">${obs.map(o=>li(o.text,`${o.isNew?"Just now":fmtDate(o.date)}, ${o.source}`)).join("")}</ul>`:"","No published observations here yet.")}
    ${sec("Camera trap observations",(cams.length||cts.length)?`<ul class="dl">${cams.map(c=>li(c.text,`${fmtDate(c.date)}, ${c.source}`)).join("")}${cts.filter(c=>!cams.some(x=>x.ct===c.id)).map(c=>li(`${c.name} is in place`,c.note)).join("")}</ul>`:"","No camera traps placed here yet.")}
    ${research.length?sec("Research notes",`<ul class="dl">${research.map(r=>li(r.t,"Exact location kept private")).join("")}</ul>`):""}

function miniMap(r){
  const z=ZMAP[r.zone];let pin="";
  const img=state.month===1?IMAGES.IMG_13_SAT_DRY_TRUE:IMAGES.IMG_14_SAT_WET_TRUE;
  if(r.sat){pin=`<path d="${z.path}" style="fill:#cfe8a0;fill-opacity:.35;stroke:#eef6d8;stroke-width:3"/>`}
  else if(r.hideLoc){pin=`<circle cx="${z.shape[0]}" cy="${z.shape[1]}" r="62" style="fill:#8fd3e0;fill-opacity:.25;stroke:#dff4f8;stroke-width:3;stroke-dasharray:8 7"/>`}
  else if(r.at){pin=`<circle cx="${r.at[0]}" cy="${r.at[1]}" r="26" style="fill:none;stroke:#ffd58a;stroke-width:3;opacity:.9"/><circle cx="${r.at[0]}" cy="${r.at[1]}" r="10" style="fill:#f0b24a;stroke:#1a2317;stroke-width:3"/>`}
  const zones=ZONES.map(q=>`<path d="${q.path}" style="fill:none;stroke:#eef2dc;stroke-width:2;opacity:.55"/>`).join("");
  const streams=STREAMS.filter(t=>t.m<=state.month).map(t=>`<path d="${openPath(t.pts)}" style="fill:none;stroke:#8fd3e0;stroke-width:4;opacity:.9"/>`).join("");
  const trails=TRAILS.filter(t=>t.m<=state.month).map(t=>`<path d="${openPath(t.pts)}" style="fill:none;stroke:#f0c98a;stroke-width:3;stroke-dasharray:10 7;opacity:.85"/>`).join("");
  const base=img?`<image href="${img}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice" opacity=".35"/><image href="${img}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice" clip-path="url(#mc)"/>`:`<path d="${BPATH}" style="fill:var(--card)"/>`;
  const cap=r.sat?"Area covered by the change signal":r.hideLoc?`Members will see only "${z.name}", not the exact point`:"Exact point, visible to the Mycelium team";
  return `<figure class="minimap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Satellite location map. ${esc(cap)}"><defs><clipPath id="mc"><path d="${BPATH}"/></clipPath></defs>${base}<g clip-path="url(#mc)">${zones}${streams}${trails}</g><path d="${BPATH}" style="fill:none;stroke:#F5F2E6;stroke-width:4"/>${pin}</svg><figcaption>${cap}</figcaption></figure>`;
}

  return `<div class="demobar"><div class="wrap">
    <div class="tag brand"><span>Dancing Frog Living Landscape</span></div>
    <div class="tag viewtag"><span class="viewas" id="viewas">View as</span><div class="seg" role="group" aria-labelledby="viewas"><button data-action="view" data-v="member" aria-pressed="${state.view==="member"}"><span class="lg">Collective member</span><span class="sm">Member</span></button><button class="${nz(2)}" data-action="view" data-v="control" aria-pressed="${state.view==="control"}"><span class="lg">Mycelium team</span><span class="sm">Mycelium team</span></button></div><button class="linkbtn" data-action="reset">Start over</button></div>
  </div></div>`;
}
function toast(){if(!state.toast)return"";return `<div class="toast" role="status"><span>${esc(state.toast.text)}</span>${state.toast.go?`<button class="${nz(5)}" data-action="gomember">See it as a member</button>`:""}</div>`}
let toastTimer=null;
function showToast(text,go){state.toast={text,go};clearTimeout(toastTimer);toastTimer=setTimeout(()=>{state.toast=null;render()},7000)}
function render(){
  satN=0;
  app.innerHTML=demobar()+(state.view==="member"?memberView():controlView())+(state.view==="member"?zoneDrawer():"")+toast();
  state.anim=false;
  document.body.style.overflow=state.zone&&state.view==="member"?"hidden":"";
}

/* =====================================================================
   12. ACTIONS
   ===================================================================== */
function curRec(){return state.records.find(x=>x.id===state.rec)}
function memberItem(r,preview){
  return {id:"P_"+r.id,kind:r.kind,date:null,m:1,source:r.source,zone:r.zone,img:r.img,stamp:r.stamp,sat:r.sat,verify:"ok",idf:r.idState==="pending"?"pend":(r.idState==="confirmed"?"conf":undefined),gen:r.hideLoc,at:r.sat?null:(r.kind==="camera"?null:r.at),ct:r.kind==="camera"?CTS.find(c=>c.zone===r.zone&&c.m===1)?.id:null,title:r.memberTitle,text:r.caption,isNew:!preview,preview:!!preview};
}
function publish(r){
  state.published=state.published.filter(p=>p.id!=="P_"+r.id);
  state.published.unshift(memberItem(r,false));
}
const actions={
  view:t=>{state.view=t.dataset.v;if(t.dataset.v==="control"&&state.guide<=2)state.guide=3;state.pop=null;state.hint=null;state.editing=false;window.scrollTo(0,0)},
  month:t=>{const m=+t.dataset.m;if(m!==state.month){state.month=m;state.anim=true;state.pop=null;state.feedAll=false}if(m===12&&state.guide===0)state.guide=1},
  more:()=>{state.feedAll=!state.feedAll},
  sat:t=>{state.sat=t.dataset.s},
  base:t=>{state.base=t.dataset.b;state.pop=null},
  zone:t=>{state.zone=t.dataset.zone;state.pop=null;if(state.guide<=1)state.guide=2},
  closezone:()=>{state.zone=null},
  marker:t=>{state.pop=state.pop===t.dataset.id?null:t.dataset.id},
  closepop:()=>{state.pop=null},
  filter:t=>{state.filter=t.dataset.f},
  rec:t=>{state.rec=t.dataset.id;state.editing=false;state.hint=null},
  verify:()=>{const r=curRec();r.verified=!r.verified;if(r.verified&&r.id==="R1"&&state.guide<=3)state.guide=4;r.log.push(r.verified?"Record verified by Mycelium team":"Record check removed");state.hint=null},
  ident:()=>{const r=curRec();r.idState=r.idState==="confirmed"?"pending":"confirmed";r.log.push(r.idState==="confirmed"?"Identification confirmed":"Identification marked as pending");state.hint=null},
  layer:t=>{const k=t.dataset.k;state.layers[k]=!state.layers[k];state.pop=null},
  hide:()=>{const r=curRec();r.hideLoc=!r.hideLoc;r.log.push(r.hideLoc?"Exact location hidden from members":"Exact location shown to members")},
  edit:()=>{state.editing=true},
  canceledit:()=>{state.editing=false},
  save:()=>{const r=curRec(),v=document.getElementById("capedit").value.trim();if(v&&v!==r.caption){r.caption=v;if(r.verified){r.verified=false;r.log.push("Member text edited. Record check removed, review again");state.hint="The text changed, so the record needs checking again before it can be approved."}else{r.log.push("Member text edited")}}state.editing=false},
  internal:()=>{const r=curRec();r.status="internal";r.log.push("Kept internal. Not visible to members");state.hint=null;showToast("Kept internal. Members will not see this record.")},
  reopen:()=>{const r=curRec();r.status="new";r.log.push("Reopened for review")},
  approve:()=>{const r=curRec();if(!r.verified){state.hint="Verify the record before approving it. The species identification can stay pending.";return}
    if(state.guide<=4)state.guide=5;r.status="published";r.log.push(r.hideLoc?"Published to members with location generalised":"Published to members");state.hint=null;publish(r);showToast("Published to members",true)},
  withdraw:()=>{const r=curRec();r.status="new";r.verified=false;r.log.push("Withdrawn from members");state.published=state.published.filter(p=>p.id!=="P_"+r.id);showToast("Withdrawn. Members no longer see this record.")},
  gomember:()=>{if(state.guide<=5)state.guide=6;state.view="member";state.toast=null;state.pop=null;window.scrollTo(0,0)},
  reset:()=>{state.view="member";state.month=1;state.zone=null;state.pop=null;state.rec="R1";state.filter="all";state.records=clone(RECORDS0);state.published=[];state.toast=null;state.editing=false;state.hint=null;state.feedAll=false;state.layers={trails:true,streams:true,obs:true,cams:true};state.guide=0;window.scrollTo(0,0)}
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-action]");
  if(!t){if(state.pop&&!e.target.closest(".pop")){state.pop=null;render()}return}
  const a=actions[t.dataset.action];if(!a)return;
  e.preventDefault();a(t);render();
  if(t.dataset.action==="zone"){const d=document.querySelector(".drawer .close");d&&d.focus()}
  if(t.dataset.action==="rec"&&window.innerWidth<900){const d=document.querySelector(".detail");d&&d.scrollIntoView({behavior:"smooth",block:"start"})}
  if(t.dataset.action==="gomember"){const f=document.querySelector(".fi.is-new");f&&f.scrollIntoView({behavior:"smooth",block:"center"})}
  });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(state.zone){state.zone=null;render()}else if(state.pop){state.pop=null;render()}return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-action]")&&e.target.tagName!=="BUTTON"){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
render();
})();
</script>
</body>
</html>
